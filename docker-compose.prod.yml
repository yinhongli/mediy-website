version: '3.8'

services:
  mediy-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediy-website
    restart: unless-stopped
    expose:
      - "3002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - mediy-network

  nginx:
    image: nginx:1.25-alpine
    container_name: mediy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/active/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - mediy-website
    networks:
      - mediy-network

  certbot:
    image: certbot/certbot:latest
    container_name: mediy-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  mediy-network:
    driver: bridge
