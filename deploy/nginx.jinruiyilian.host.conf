server {
    listen 80;
    server_name jinruiyilian.com www.jinruiyilian.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name www.jinruiyilian.com;

    ssl_certificate /etc/letsencrypt/live/jinruiyilian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinruiyilian.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name jinruiyilian.com;

    ssl_certificate /etc/letsencrypt/live/jinruiyilian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jinruiyilian.com/privkey.pem;

    return 301 https://www.jinruiyilian.com$request_uri;
}
